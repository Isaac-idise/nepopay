spring:
  application:
    name: nepopay
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nepopay}
    username: ${DATABASE_USERNAME:nepopay}
    password: ${DATABASE_PASSWORD:change_me_locally}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
