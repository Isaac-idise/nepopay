spring:
  application:
    name: nepopay
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nepopay}
    username: ${DATABASE_USERNAME:nepopay}
    password: ${DATABASE_PASSWORD:change_me_locally}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  # Set FORWARD_HEADERS=native when running behind a trusted proxy (Render, Railway, Nginx) so client IPs are real.
  forward-headers-strategy: ${FORWARD_HEADERS:none}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

nepopay:
  demo:
    welcome-credit-naira: 100000
  security:
    # The default below is for local development ONLY. Production must set JWT_SECRET (32+ characters).
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-0123456789}
    access-token-minutes: 15
    refresh-token-days: 7
    cookie-secure: ${COOKIE_SECURE:false}      # true in production (HTTPS)
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}  # "None" if frontend and API are on different sites
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  limits:
    min-transfer-kobo: 100            # N1
    per-transfer-kobo: 50000000       # N500,000
    daily-kobo: 100000000             # N1,000,000 per sender per day (Africa/Lagos)
  pin:
    max-failed-attempts: 3
    lock-minutes: 15
  rate-limit:
    enabled: true
    login-ip-per-minute: 30
    login-account-per-window: 10      # per account, per 15 minutes
    register-per-hour: 30
    refresh-per-minute: 30
    search-per-minute: 30
    transfer-per-minute: 10
    pin-change-per-window: 5          # per 15 minutes
    reset-per-hour: 5
